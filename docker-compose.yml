services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_db}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    container_name: nexus_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # LangGraph parallel orchestration is opt-in: set USE_LANGGRAPH=1 in .env
      USE_LANGGRAPH: ${USE_LANGGRAPH:-0}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:///app/mlflow_data/mlruns}
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - nexus_mlflow:/app/mlflow_data
      - ./docs:/app/docs
      - ./evaluation:/app/evaluation

  dashboard:
    build:
      context: .
      dockerfile: deployment/Dockerfile.dashboard
    container_name: nexus_dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      STREAMLIT_THEME_BASE: dark
      STREAMLIT_THEME_PRIMARY_COLOR: "#FFC247"
      STREAMLIT_THEME_BACKGROUND_COLOR: "#14112B"
      STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR: "#1D1A3A"
      STREAMLIT_THEME_TEXT_COLOR: "#EEEBFF"
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ./project2_analytics/dashboard:/app/project2_analytics/dashboard

  # BI layer: ad-hoc dashboards on the warehouse. Connect it as `nexus_readonly` (not nexus_user) so
  # BI users get the same PII-free view as the agent. Setup steps: docs/metabase.md
  metabase:
    image: metabase/metabase:v0.50.24
    container_name: nexus_metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_APP_DB:-metabase_app}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-nexus_user}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-change_me}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"

volumes:
  nexus_pgdata:
  nexus_mlflow:
