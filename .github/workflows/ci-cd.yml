name: NEXUS CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO_API: nexus-api
  ECR_REPO_DASHBOARD: nexus-dashboard

jobs:
  test:
    runs-on: ubuntu-24.04
    # A real Postgres, so the DB-backed tests (read-only role, PII grants, audit chain) actually run.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus_user
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: nexus_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus_user" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: nexus_user
      PGPASSWORD: change_me
      PGDATABASE: nexus_db
      DATABASE_URL: postgresql+psycopg2://nexus_user:change_me@localhost:5432/nexus_db
      READONLY_DATABASE_URL: postgresql+psycopg2://nexus_readonly:change_me_too@localhost:5432/nexus_db
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest kaggle
      - name: Download the REAL dataset (same source as the README)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download -d parsakh/global-e-commerce-and-supply-chain-database
          unzip -q global-e-commerce-and-supply-chain-database.zip -d data/raw/
      - name: Build the warehouse from the real data
        run: |
          python project2_analytics/ingestion/load_csv_to_postgres.py
          bash project2_analytics/sql/apply_all.sh
          psql -c "ALTER ROLE nexus_readonly PASSWORD 'change_me_too'"
      - name: Train the models on the real data
        run: python project2_analytics/ml/train_all.py
        env:
          MODEL_DIR: models
      - name: Offline unit tests (no DB, no LLM)
        run: pytest project1_agentic/tests/test_number_verifier.py project1_agentic/tests/test_pii.py project1_agentic/tests/test_nl2sql_core.py evaluation/tests -q
      - name: DB-backed tests on the real warehouse (read-only role, PII grants, audit chain, forecast, anomaly, charts, supervisor end-to-end)
        run: pytest project1_agentic/tests project2_analytics/tests -q
        env:
          TEST_MODEL_DIR: models
      - name: Benchmark self-validation (gold SQL on real data, mutants, adversarial SQL)
        run: python evaluation/internal_benchmark.py validate
        env:
          MODEL_DIR: models
      - name: Forecast backtest and anomaly evaluation on the real data
        run: |
          python evaluation/forecast_backtest.py
          python evaluation/anomaly_eval.py

  build-and-deploy:
    needs: test
    # Deploys to AWS only on a manual run (Actions > Run workflow); needs the AWS_* repository secrets.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          docker build -f deployment/Dockerfile.api \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:${{ github.sha }} \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:latest .
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_API }}:latest

      - name: Build and push dashboard image
        run: |
          docker build -f deployment/Dockerfile.dashboard \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_DASHBOARD }}:${{ github.sha }} \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_DASHBOARD }}:latest .
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_DASHBOARD }}:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO_DASHBOARD }}:latest

      - name: Force new ECS deployments
        run: |
          aws ecs update-service --cluster nexus-cluster --service nexus-api --force-new-deployment
          aws ecs update-service --cluster nexus-cluster --service nexus-dashboard --force-new-deployment
